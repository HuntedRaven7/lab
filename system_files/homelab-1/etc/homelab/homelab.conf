# homelab-1 (worker node) configuration.
# Set HOMELAB_CONTROL_PLANE to the address of homelab-0 so the join service
# can fetch the k0s worker token. No secrets in this file or the repo.
HOMELAB_ROLE=node
# .local resolves via systemd-resolved mDNS with the per-node hostname baked
# into the image. Set a static IP here if your AP/VLAN blocks mDNS.
HOMELAB_CONTROL_PLANE=homelab-0.local
HOMELAB_TOKEN_PORT=6447