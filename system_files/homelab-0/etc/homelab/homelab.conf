# homelab-0 (control plane) configuration.
# Edit HOMELAB_METALLB_ADDRESSES and HOMELAB_DOMAIN for your network.
# Secrets (GitHub OAuth, etc.) belong in /etc/homelab/secrets/ at runtime,
# never in this file or the repo.
HOMELAB_ROLE=control-plane
HOMELAB_DOMAIN=home.arpa
#HOMELAB_METALLB_ADDRESSES=192.168.1.240-192.168.1.250
# Set this explicitly on multi-homed nodes (LAN + Tailscale). It is used for
# the worker join token and Cilium k8sServiceHost. Defaults to the source
# address of the default route when unset.
#HOMELAB_API_ADDRESS=192.168.1.10
HOMELAB_KUBESTELLAR_VERSION=0.30.1
HOMELAB_CONSOLE_VERSION=0.3.43
HOMELAB_CILIUM_VERSION=1.20.4
# Optional first-boot Tailscale auth: put a reusable auth key in
# /etc/homelab/secrets/tailscale-authkey (mode 0600). Never commit it.