# Kernel modules needed before k0s/containerd/Cilium start on a bootc node.
# On an immutable root it is much easier to load these at boot than to rely on
# containerd/Cilium loading them on demand.
overlay
br_netfilter
vxlan
bridge
nf_conntrack
nf_nat
ip_tables
iptable_filter
iptable_nat
xt_conntrack
xt_MASQUERADE
sch_htb
cls_bpf
