# Kubernetes / Cilium host tuning for bootc homelab nodes.
#
# Applied by systemd-sysctl at boot. systemd-sysctl runs after
# systemd-modules-load, so the modules listed in
# /etc/modules-load.d/kubernetes.conf (br_netfilter, nf_conntrack, ...) exist
# before these keys are written.

# Pod/service forwarding and bridged traffic (Cilium + any CNI).
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.forwarding = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# Cilium kube-proxy replacement expects loose/disabled reverse-path filtering;
# strict rp_filter drops pod traffic on multi-homed nodes (LAN + Tailscale).
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# Many controllers/watchers (KubeStellar, Console, Argo, kube-prometheus).
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# Postgres/Elasticsearch-style workloads and a busy container runtime.
vm.max_map_count = 262144
fs.file-max = 2097152

# Host-side conntrack (Cilium has its own BPF maps, but the host stack and
# any iptables/nftables path still use nf_conntrack).
net.netfilter.nf_conntrack_max = 131072
