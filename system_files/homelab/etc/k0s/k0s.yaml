# /etc/k0s/k0s.yaml — k0s cluster configuration.
#
# Cilium replaces kube-proxy and provides the CNI, so:
#   - network.provider is "custom" (k0s ships no CNI)
#   - network.kubeProxy.disabled is true
# Helm is disabled: KubeStellar and the Console are installed by the
# homelab-setup service with the standalone helm binary, not by k0s.
#
# bootc: /opt/cni/bin is read-only, so kubelet uses /var/lib/cni/bin.
apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
spec:
  network:
    provider: custom
    podCIDR: "10.244.0.0/16"
    serviceCIDR: "10.96.0.0/12"
    kubeProxy:
      disabled: true
  extensions:
    helm:
      concurrencyLevel: 5
  storage:
    type: etcd
  workerProfiles:
    - name: default
      values:
        cniBinDir: /var/lib/cni/bin
        cniConfDir: /etc/cni/net.d