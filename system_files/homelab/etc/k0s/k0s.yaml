# /etc/k0s/k0s.yaml — k0s cluster configuration.
#
# Cilium replaces kube-proxy and provides the CNI, so:
#   - network.provider is "custom" (k0s ships no CNI)
#   - network.kubeProxy.disabled is true
# Helm/autopilot are disabled in k0s controller args; Cilium, KubeStellar and
# the Console are installed manually with the standalone helm binary (see docs).
#
# bootc: /opt/cni/bin is read-only. CNI bin/conf paths are configured in the
# containerd drop-in at /etc/k0s/containerd.d/10-cni-paths.toml, not here
# (KubeletConfiguration has no cniBinDir/cniConfDir fields).
apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
spec:
  network:
    provider: custom
    podCIDR: "10.244.0.0/16"
    serviceCIDR: "10.96.0.0/12"
    kubeProxy:
      disabled: true
  extensions:
    helm:
      concurrencyLevel: 5
  storage:
    type: etcd
  workerProfiles:
    - name: default
      values:
        cgroupDriver: systemd
        systemReserved:
          cpu: 250m
          memory: 256Mi
          ephemeral-storage: 1Gi
        kubeReserved:
          cpu: 250m
          memory: 512Mi
          ephemeral-storage: 1Gi
        evictionHard:
          memory.available: 200Mi
          nodefs.available: 10%
          imagefs.available: 10%
        evictionMinimumReclaim:
          memory.available: 0Mi
          nodefs.available: 500Mi
          imagefs.available: 500Mi
        containerLogMaxSize: 50Mi
        containerLogMaxFiles: 3
        maxPods: 110
