# CNI paths for bootc: /opt is on the immutable root, so Cilium installs its
# CNI binary under /var/lib/cni/bin and writes config to /etc/cni/net.d.
#
# k0s v1.34.x bundles containerd 1.x, hence the v1 CRI plugin path and
# version = 2. When moving to k0s >= 1.36 (containerd 2), this drop-in must be
# converted to the v3 format:
#   [plugins."io.containerd.cri.v1.runtime".cni]
# and version = 3.
version = 2

[plugins."io.containerd.grpc.v1.cri".cni]
  bin_dir = "/var/lib/cni/bin"
  conf_dir = "/etc/cni/net.d"
